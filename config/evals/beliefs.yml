# beliefs.yml — What must be true about this project
#
# Types:
#   file_check     — file exists, contains string, min lines
#   command_check  — run a shell command, exit 0 = pass (runs in project dir)
#   llm_judge      — Claude evaluates code against a prompt (requires prompt: field)
#   feature_review — Claude evaluates feature completeness
#
# Fields:
#   id:        unique identifier
#   belief:    human-readable description
#   type:      one of the types above
#   severity:  block (score = 0 if failing) | warn (flags but continues)
#   path:      file or directory to check (file_check, llm_judge)
#   contains:  string that must appear in the file (file_check)
#   min_lines: minimum line count (file_check)
#   command:   shell command to run (command_check)
#   prompt:    evaluation question for Claude (llm_judge)
#   feature:   feature name to scope context (llm_judge, feature_review)

beliefs:

  # ── Core — does the project know what it's for? ──

  - id: has-value-hypothesis
    belief: "Project has a defined value hypothesis"
    type: file_check
    path: "config/rhino.yml"
    contains: "hypothesis:"
    severity: block

  - id: has-readme
    belief: "README exists and explains the project"
    type: file_check
    path: "README.md"
    min_lines: 5
    severity: warn

  - id: build-succeeds
    belief: "Project builds without errors"
    type: command_check
    command: npm run build 2>&1 | tail -1
    severity: block

  - id: has-entry-point
    belief: "App has a main entry point (layout.tsx)"
    type: file_check
    path: "src/app/layout.tsx"
    contains: "RootLayout"
    severity: block

  # ── game-modes — 8 interactive learning games ──

  - id: game-modes-play-hub
    belief: "Play page lists all game modes"
    type: file_check
    path: "src/app/play/page.tsx"
    contains: "GAMES"
    feature: game-modes
    severity: block

  - id: game-modes-animation
    belief: "Letter Animation game exists"
    type: file_check
    path: "src/app/play/animation/page.tsx"
    min_lines: 20
    feature: game-modes
    severity: warn

  - id: game-modes-choose4
    belief: "Choose from 4 game exists (hardest multiple choice)"
    type: file_check
    path: "src/app/play/choose4/page.tsx"
    min_lines: 20
    feature: game-modes
    severity: warn

  - id: game-modes-namegame
    belief: "Name Game exists"
    type: file_check
    path: "src/app/play/namegame/page.tsx"
    min_lines: 20
    feature: game-modes
    severity: warn

  - id: game-modes-abcsong
    belief: "ABC Song game exists"
    type: file_check
    path: "src/app/play/abcsong/page.tsx"
    min_lines: 20
    feature: game-modes
    severity: warn

  - id: game-modes-words
    belief: "Word Learning game exists"
    type: file_check
    path: "src/app/play/words/page.tsx"
    min_lines: 20
    feature: game-modes
    severity: warn

  - id: game-modes-resume
    belief: "Games support resume via GameState"
    type: file_check
    path: "src/lib/db.ts"
    contains: "saveGameState"
    feature: game-modes
    severity: warn

  - id: game-modes-all-routes
    belief: "All 8 game route directories exist"
    type: command_check
    command: "test -d src/app/play/animation && test -d src/app/play/namegame && test -d src/app/play/single && test -d src/app/play/choose2 && test -d src/app/play/choose3 && test -d src/app/play/choose4 && test -d src/app/play/abcsong && test -d src/app/play/words"
    feature: game-modes
    severity: block

