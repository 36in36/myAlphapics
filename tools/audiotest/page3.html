<h1>Page 3 — Tap-to-start gate</h1><p class="sub">The proposed fix. Nothing plays until the gate is tapped; after that, audio should work for the rest of the page.</p>

<button id="gate">TAP TO START</button><div id="after" style="display:none"><button id="p1">Play clip A</button><button id="p2">Play clip B (no new gesture needed?)</button></div>
<button id="share">Share log → AirDrop</button>
<div class="row">
  <button class="alt" id="copy">Copy log</button>
  <button class="alt" id="clear">Clear log</button>
</div>
<pre id="log"></pre>
<script src="audio-test.js?v=2"></script>
<script>
const PAGE = 'P3';
environment(); wireCommon();
document.getElementById('gate').onclick = async () => {
  document.getElementById('gate').style.display='none';
  document.getElementById('after').style.display='block';
  log('gate tapped — unlocking');
  await playBuffer('letter','P3-gate');
};
document.getElementById('p1').onclick = () => playBuffer('letter','P3-tapA');
document.getElementById('p2').onclick = () => setTimeout(()=>playBuffer('praise','P3-delayedB'), 1200);
</script>
